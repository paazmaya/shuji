name: Node.js CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "LICENSE*"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "LICENSE*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: chainguard-actions/actions-checkout@37298d8de412b35988dd165ffae45f45b329d365 # v7.0.1
      with:
        persist-credentials: false

    - name: Use Node.js v24
      uses: chainguard-actions/actions-setup-node@0fc7fd914070e07cca22606e4cab3cfeaf43711d # v7.1.0
      with:
        node-version: '24.x'

    - name: Install Node.js dependencies
      run: npm ci --ignore-scripts

    - name: Lint and test
      run: |
        npm run lint
        npm test
        npm run coverage

    - name: Upload code coverage to codecov
      # https://github.com/chainguard-actions/codecov-codecov-action
      uses: chainguard-actions/codecov-codecov-action@4e95a2ab133962d45d778e4ce39d1e21e4e536de # v7.1.1
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: coverage.lcov